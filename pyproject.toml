[project]
name = "monitoramento-vencimentos"
version = "0.1.0"
description = "Monitoramento multiempresa de vencimentos via Google Sheets"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.130",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "google-api-python-client>=2.140,<3",
  "google-auth>=2.34,<3",
  "google-auth-httplib2>=0.2,<1",
  "jinja2>=3.1,<4",
  "email-validator>=2.2,<3",
  "tenacity>=9.0,<10",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5.0,<7",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E701", "E702", "B008"]

[tool.coverage.run]
source = ["app"]
